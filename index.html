<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <!-- Main Card -->
                <div class="card">
                    
                    <!-- Header -->
                    <div class="card-header text-center">
                        <h2>Non-Metal Elements</h2>
                        <p>Periodic Table Information Finder</p>
                    </div>

                    <div class="card-body">
                        <!-- Instructions -->
                        <div class="alert alert-info">
                            <b>Instructions:</b><br>
                            Enter the symbol of a non-metal element (Example: H, O, Cl, Ne, Xe).
                        </div>

                        <!-- Input Field -->
                        <div class="mb-3">
                            <label for="symbol_input" class="form-label">Element Symbol</label>
                            <input type="text" id="symbol_input" class="form-control" placeholder="H">
                        </div>

                        <!-- Button -->
                        <button class="btn btn-success w-100" py-click="search_element">
                            Check Details
                        </button>

                        <!-- Output Container -->
                        <h5 class="mt-4">Result</h5>
                        <div id="result_display" class="p-3 bg-light rounded">
                            Please enter a symbol above and click "Check Details".
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="card-footer text-center">
                        Skills Test: Dictionaries, 10-Sapphire
                    </div>
    <!-- PyScript Link -->
    <script type="py" src="main.py"></script>
</body>
</html>
